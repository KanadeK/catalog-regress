[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-regress"
version = "0.1.0"
description = "Protect previously usable gettext translations with a local baseline regression gate."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = ["polib==1.2.0"]
keywords = ["gettext", "localization", "regression", "ci", "po"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Software Development :: Localization"]

[project.urls]
Homepage = "https://github.com/KanadeK/catalog-regress"
Issues = "https://github.com/KanadeK/catalog-regress/issues"

[project.scripts]
catalog-regress = "catalog_regress.cli:main"

[project.optional-dependencies]
dev = ["build==1.6.1", "ruff==0.17.2", "coverage==7.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["catalog_regress"]

[tool.coverage.report]
show_missing = true
fail_under = 85
